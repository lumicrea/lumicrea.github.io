<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Montgomery Data Demo</title>
</head>
<body>
  <h1>Montgomery Open Data (Sample)</h1>
  <pre id="output">Loading...</pre>

<script>
  async function loadData() {
    const contentDiv = document.getElementById("data");
    try {
      const res = await fetch("https://noisy-truth-dd8f.reeamm.workers.dev");
      if (!res.ok) throw new Error(`HTTP error! ${res.status}`);
      const data = await res.json(); // <-- parse JSON
      console.log(data); // for debugging

      contentDiv.innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
    } catch (err) {
      contentDiv.innerHTML = `<p style="color:red">Error: ${err.message}</p>`;
    }
  }

  loadData();
</script>

</body>
</html>
