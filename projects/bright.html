<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Montgomery Data Demo</title>
</head>
<body>
  <h1>Montgomery Open Data (Sample)</h1>
  <pre id="output">Loading...</pre>

  <script>
    // Replace with your Cloudflare Worker URL
    const workerUrl = "https://noisy-truth-dd8f.reeamm.workers.dev/"

    fetch(workerUrl)
      .then(res => res.json())
      .then(data => {
        document.getElementById("output").textContent = JSON.stringify(data.result.records, null, 2)
      })
      .catch(err => {
        document.getElementById("output").textContent = "Error: " + err
      })
  </script>
</body>
</html>
